<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="Helvetica,Arial,sans-serif" font-size="12">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="1600" height="800" fill="white"/>
<line x1="760" y1="70" x2="760" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="669" y1="170" x2="416" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="542" y="201" text-anchor="middle" fill="#333" stroke="white" stroke-width="3" paint-order="stroke">NO</text>
<line x1="839" y1="170" x2="1061" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="950" y="201" text-anchor="middle" fill="#333" stroke="white" stroke-width="3" paint-order="stroke">YES</text>
<line x1="294" y1="290" x2="195" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="244" y="326" text-anchor="middle" fill="#333" stroke="white" stroke-width="3" paint-order="stroke">disabled</text>
<line x1="351" y1="290" x2="434" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="392" y="326" text-anchor="middle" fill="#333" stroke="white" stroke-width="3" paint-order="stroke">enabled</text>
<line x1="1100" y1="290" x2="973" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1037" y="326" text-anchor="middle" fill="#333" stroke="white" stroke-width="3" paint-order="stroke">YES</text>
<line x1="1172" y1="290" x2="1273" y2="370" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1222" y="326" text-anchor="middle" fill="#333" stroke="white" stroke-width="3" paint-order="stroke">NO</text>
<line x1="1253" y1="420" x2="1040" y2="522" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1146" y="467" text-anchor="middle" fill="#333" stroke="white" stroke-width="3" paint-order="stroke">Idle</text>
<line x1="1283" y1="420" x2="1195" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1239" y="466" text-anchor="middle" fill="#333" stroke="white" stroke-width="3" paint-order="stroke">Lock</text>
<line x1="1312" y1="420" x2="1342" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1327" y="466" text-anchor="middle" fill="#333" stroke="white" stroke-width="3" paint-order="stroke">Error</text>
<line x1="1337" y1="420" x2="1467" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1402" y="466" text-anchor="middle" fill="#333" stroke="white" stroke-width="3" paint-order="stroke">CPU</text>
<line x1="135" y1="690" x2="135" y2="720" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="405" y1="690" x2="405" y2="720" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="675" y1="690" x2="675" y2="720" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="945" y1="690" x2="945" y2="720" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="600" y="20" width="320" height="50" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="760.0" y="49" text-anchor="middle">Subscriber is behind / not changing</text>
<rect x="600" y="120" width="320" height="50" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="760.0" y="141" text-anchor="middle" font-weight="bold">Publisher: is the slot active?</text>
<text x="760.0" y="157" text-anchor="middle">(pg_replication_slots.active)</text>
<rect x="160" y="240" width="330" height="50" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="325.0" y="261" text-anchor="middle" font-weight="bold">Subscriber: is the subscription enabled?</text>
<text x="325.0" y="277" text-anchor="middle">(pg_subscription.subenabled)</text>
<rect x="980" y="240" width="320" height="50" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="1140.0" y="261" text-anchor="middle" font-weight="bold">Is replay_lsn advancing?</text>
<text x="1140.0" y="277" text-anchor="middle">(sample twice)</text>
<rect x="20" y="370" width="250" height="80" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="145.0" y="398" text-anchor="middle" font-weight="bold">disable_on_error was hit</text>
<text x="145.0" y="414" text-anchor="middle">read the subscriber log,</text>
<text x="145.0" y="430" text-anchor="middle">fix the cause, then ENABLE</text>
<rect x="330" y="370" width="290" height="80" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="475.0" y="390" text-anchor="middle" font-weight="bold">Worker not running</text>
<text x="475.0" y="406" text-anchor="middle">log shows connection errors:</text>
<text x="475.0" y="422" text-anchor="middle">pg_hba, password, network,</text>
<text x="475.0" y="438" text-anchor="middle">max_wal_senders, slots in use</text>
<rect x="790" y="370" width="240" height="80" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="910.0" y="390" text-anchor="middle" font-weight="bold">Just slow</text>
<text x="910.0" y="406" text-anchor="middle">compare apply speed with</text>
<text x="910.0" y="422" text-anchor="middle">the publisher write rate</text>
<text x="910.0" y="438" text-anchor="middle">(topic 11)</text>
<rect x="1140" y="370" width="330" height="50" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="1305.0" y="391" text-anchor="middle" font-weight="bold">Subscriber: what is the apply</text>
<text x="1305.0" y="407" text-anchor="middle">worker doing? (pg_stat_activity)</text>
<rect x="860" y="520" width="180" height="90" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="950.0" y="545" text-anchor="middle" font-weight="bold">Idle (LogicalApplyMain)</text>
<text x="950.0" y="561" text-anchor="middle">but sent &gt; replay:</text>
<text x="950.0" y="577" text-anchor="middle">network or</text>
<text x="950.0" y="593" text-anchor="middle">wal_sender_timeout</text>
<rect x="1060" y="520" width="190" height="90" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="1155.0" y="553" text-anchor="middle" font-weight="bold">wait_event = Lock</text>
<text x="1155.0" y="569" text-anchor="middle">find the blocker in</text>
<text x="1155.0" y="585" text-anchor="middle">pg_locks, resolve it</text>
<rect x="1270" y="520" width="170" height="90" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="1355.0" y="553" text-anchor="middle" font-weight="bold">Restarting / ERROR</text>
<text x="1355.0" y="569" text-anchor="middle">read the error</text>
<text x="1355.0" y="585" text-anchor="middle">(topic 12 table)</text>
<rect x="1460" y="520" width="130" height="90" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="1525.0" y="545" text-anchor="middle" font-weight="bold">100 % CPU on one</text>
<text x="1525.0" y="561" text-anchor="middle">huge transaction:</text>
<text x="1525.0" y="577" text-anchor="middle">wait; streaming</text>
<text x="1525.0" y="593" text-anchor="middle">(topic 07, 11)</text>
<rect x="20" y="650" width="230" height="40" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="135.0" y="674" text-anchor="middle">CREATE SUBSCRIPTION hangs</text>
<rect x="20" y="720" width="230" height="60" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="135.0" y="738" text-anchor="middle" font-weight="bold">Old open transaction on the</text>
<text x="135.0" y="754" text-anchor="middle">publisher; slot creation</text>
<text x="135.0" y="770" text-anchor="middle">waits (topic 06)</text>
<rect x="290" y="650" width="230" height="40" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="405.0" y="674" text-anchor="middle">Table stuck in 'd' or 'i'</text>
<rect x="290" y="720" width="230" height="60" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="405.0" y="738" text-anchor="middle" font-weight="bold">Topic 10 'What goes wrong':</text>
<text x="405.0" y="754" text-anchor="middle">worker limits, copy errors,</text>
<text x="405.0" y="770" text-anchor="middle">tablesync slot waiting</text>
<rect x="560" y="650" width="230" height="40" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="675.0" y="674" text-anchor="middle">Publisher disk filling</text>
<rect x="560" y="720" width="230" height="60" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="675.0" y="738" text-anchor="middle" font-weight="bold">Find the inactive / lagging</text>
<text x="675.0" y="754" text-anchor="middle">slot; fix the subscriber or</text>
<text x="675.0" y="770" text-anchor="middle">drop it (topic 05)</text>
<rect x="830" y="650" width="230" height="40" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="945.0" y="674" text-anchor="middle">Rows differ between sides</text>
<rect x="830" y="720" width="230" height="60" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="945.0" y="738" text-anchor="middle" font-weight="bold">confl_* counters, log (12);</text>
<text x="945.0" y="754" text-anchor="middle">compare checksums, then</text>
<text x="945.0" y="770" text-anchor="middle">repair or re-sync a table</text>
</svg>