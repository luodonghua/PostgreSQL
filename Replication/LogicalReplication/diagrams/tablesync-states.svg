<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="940" height="250" font-family="Helvetica,Arial,sans-serif" font-size="12">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="940" height="250" fill="white"/>
<line x1="150" y1="90" x2="190" y2="90" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="340" y1="90" x2="380" y2="90" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="530" y1="90" x2="570" y2="90" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="720" y1="90" x2="760" y2="90" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="294" y1="120" x2="332" y2="160" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="20" y="60" width="130" height="60" rx="8" fill="#f5f5f5" stroke="#666666"/>
<text x="85.0" y="78" text-anchor="middle" font-weight="bold">i  init</text>
<text x="85.0" y="94" text-anchor="middle">queued; worker</text>
<text x="85.0" y="110" text-anchor="middle">not started</text>
<rect x="190" y="60" width="150" height="60" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="265.0" y="78" text-anchor="middle" font-weight="bold">d  data copy</text>
<text x="265.0" y="94" text-anchor="middle">temp slot + snapshot,</text>
<text x="265.0" y="110" text-anchor="middle">COPY running</text>
<rect x="380" y="60" width="150" height="60" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="455.0" y="78" text-anchor="middle" font-weight="bold">f  finished copy</text>
<text x="455.0" y="94" text-anchor="middle">(then in-memory w, c:</text>
<text x="455.0" y="110" text-anchor="middle">sync catches up to apply)</text>
<rect x="570" y="60" width="150" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="645.0" y="78" text-anchor="middle" font-weight="bold">s  sync done</text>
<text x="645.0" y="94" text-anchor="middle">sync worker exits; apply</text>
<text x="645.0" y="110" text-anchor="middle">watches until that LSN</text>
<rect x="760" y="60" width="150" height="60" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="835.0" y="78" text-anchor="middle" font-weight="bold">r  ready</text>
<text x="835.0" y="94" text-anchor="middle">normal replication;</text>
<text x="835.0" y="110" text-anchor="middle">temp slot dropped</text>
<rect x="190" y="160" width="340" height="60" rx="8" fill="#fff2cc" stroke="#d6b656"/>
<text x="360.0" y="178" text-anchor="middle" font-weight="bold">Changes that commit during the copy are streamed from the</text>
<text x="360.0" y="194" text-anchor="middle">temp slot's start LSN and applied by the tablesync worker</text>
<text x="360.0" y="210" text-anchor="middle">after COPY (this is why no write is lost or doubled)</text>
</svg>