<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica,Arial,sans-serif" font-size="12">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="1000" height="560" fill="white"/>
<line x1="310" y1="65" x2="355" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="645" y1="65" x2="690" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="835" y1="110" x2="835" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="690" y1="215" x2="645" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="355" y1="215" x2="310" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="165" y1="260" x2="165" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="500" y1="260" x2="500" y2="320" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<line x1="165" y1="410" x2="165" y2="460" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="20" y="20" width="290" height="90" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="165.0" y="53" text-anchor="middle" font-weight="bold">1. Find the fork point</text>
<text x="165.0" y="69" text-anchor="middle">compare the timeline histories</text>
<text x="165.0" y="85" text-anchor="middle">of the old and new primary</text>
<rect x="355" y="20" width="290" height="90" rx="8" fill="#fff2cc" stroke="#d6b656"/>
<text x="500.0" y="53" text-anchor="middle" font-weight="bold">2. Find the last common checkpoint</text>
<text x="500.0" y="69" text-anchor="middle">before the fork point,</text>
<text x="500.0" y="85" text-anchor="middle">in the old primary's WAL</text>
<rect x="690" y="20" width="290" height="90" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="835.0" y="53" text-anchor="middle" font-weight="bold">3. Read the old primary's own WAL</text>
<text x="835.0" y="69" text-anchor="middle">from that checkpoint to its end;</text>
<text x="835.0" y="85" text-anchor="middle">note every block it touched</text>
<rect x="690" y="170" width="290" height="90" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
<text x="835.0" y="203" text-anchor="middle" font-weight="bold">4. Compare file lists</text>
<text x="835.0" y="219" text-anchor="middle">new primary vs old primary,</text>
<text x="835.0" y="235" text-anchor="middle">decide an action per file</text>
<rect x="355" y="170" width="290" height="90" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="500.0" y="203" text-anchor="middle" font-weight="bold">5. Copy from the new primary:</text>
<text x="500.0" y="219" text-anchor="middle">the noted blocks, size fixes,</text>
<text x="500.0" y="235" text-anchor="middle">other files, WAL from the fork on</text>
<rect x="20" y="170" width="290" height="90" rx="8" fill="#fff2cc" stroke="#d6b656"/>
<text x="165.0" y="203" text-anchor="middle" font-weight="bold">6. Write backup_label (start =</text>
<text x="165.0" y="219" text-anchor="middle">last common checkpoint) and set</text>
<text x="165.0" y="235" text-anchor="middle">minRecoveryPoint = new primary's WAL end</text>
<rect x="20" y="320" width="290" height="90" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="165.0" y="353" text-anchor="middle" font-weight="bold">7. Start the old primary:</text>
<text x="165.0" y="369" text-anchor="middle">it replays the new primary's WAL</text>
<text x="165.0" y="385" text-anchor="middle">from the checkpoint, then streams</text>
<rect x="355" y="320" width="290" height="90" rx="8" fill="#f8cecc" stroke="#b85450"/>
<text x="500.0" y="353" text-anchor="middle" font-weight="bold">Changed on the OLD primary</text>
<text x="500.0" y="369" text-anchor="middle">after the fork (known from step 3):</text>
<text x="500.0" y="385" text-anchor="middle">overwritten by the copy</text>
<rect x="20" y="460" width="290" height="80" rx="8" fill="#d5e8d4" stroke="#82b366"/>
<text x="165.0" y="488" text-anchor="middle" font-weight="bold">Changed on the NEW primary</text>
<text x="165.0" y="504" text-anchor="middle">after the fork: applied by the</text>
<text x="165.0" y="520" text-anchor="middle">WAL replay in step 7</text>
</svg>