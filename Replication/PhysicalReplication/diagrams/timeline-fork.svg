<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="1060" height="330" font-family="Helvetica,Arial,sans-serif" font-size="12">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="1060" height="330" fill="white"/>
<line x1="220" y1="145" x2="300" y2="145" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="490" y1="127" x2="637" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="563" y="110" text-anchor="middle" fill="#333" stroke="white" stroke-width="3" paint-order="stroke">promote</text>
